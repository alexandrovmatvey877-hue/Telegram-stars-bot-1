<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

tg.setHeaderColor("bg_color");
tg.setBackgroundColor("bg_color");

const user = tg.initDataUnsafe?.user;

if (user) {

    document.querySelector(".subtitle").innerHTML =
        `Добро пожаловать, <b>${user.first_name}</b>`;

    fetch("https://white-stars-api.onrender.com/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            telegram_id: user.id,
            username: user.username || user.first_name
        })
    })
    .then(res => res.json())
    .then(data => {
        console.log("Регистрация:", data);
    })
    .catch(err => {
        console.error("Ошибка регистрации:", err);
    });

}

function topup(){
    tg.showAlert("Функция пополнения баланса находится в разработке.");
}

function buyStars(){
    tg.showAlert("Покупка Telegram Stars скоро станет доступна.");
}

function buyPremium(){
    tg.showAlert("Покупка Telegram Premium скоро станет доступна.");
}
function buyGift(){
    tg.showAlert("Покупка Telegram Gifts скоро станет доступна.");
}

function buyNFT(){

}

function openPrices(){
    window.location.href = "pages/prices.html";
}

function openPrivacy(){
    window.location.href = "pages/privacy.html";
}

function openTerms(){
    window.location.href = "pages/terms.html";
}

function openSupport(){
    tg.openTelegramLink("https://t.me/WHITE_STARS_CONNECT");
}

</script>
