<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #f3f5f8;
            color: #111;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        /* ШАПКА */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: #111;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
        }

        .logo-text h1 {
            font-size: 30px;
            font-weight: 800;
            line-height: 1;
        }

        .logo-text p {
            margin-top: 6px;
            font-size: 14px;
            color: #777;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-home {
            height: 46px;
            padding: 0 20px;
            border: none;
            border-radius: 14px;
            background: #111;
            color: #fff;
            font-weight: 700;
            transition: .2s;
            cursor: pointer;
        }

        .back-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        .back-home:active {
            transform: scale(.97);
        }

        /* КАРТОЧКА ПРОФИЛЯ */
        .profile-card {
            background: #fff;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            margin-bottom: 24px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            border: 3px solid #111;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 800;
        }

        .profile-id {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }

        .profile-status {
            font-size: 14px;
            margin-top: 6px;
        }

        .online {
            color: #22c55e;
            font-weight: 700;
        }

        .offline {
            color: #999;
        }

        /* СТАТИСТИКА */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 20px;
        }

        .stat-item {
            background: #f8f9fb;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: #111;
        }

        .stat-label {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        /* ИНФО */
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ececec;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
            font-size: 14px;
        }

        .info-value {
            font-weight: 600;
            font-size: 14px;
        }

        /* ИЗМЕНЕНИЕ БАЛАНСА */
        .balance-edit {
            margin-top: 24px;
            padding: 20px;
            background: #f8f9fb;
            border-radius: 16px;
            border: 2px solid #e0e0e0;
        }

        .balance-edit h4 {
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 700;
        }

        .balance-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        #balanceInput {
            flex: 1;
            min-width: 150px;
            height: 46px;
            padding: 0 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            transition: .2s;
        }

        #balanceInput:focus {
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(17, 17, 17, .1);
        }

        .btn {
            height: 46px;
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        .btn:active {
            transform: scale(.97);
        }

        .btn-green {
            background: #22c55e;
        }

        .btn-red {
            background: #e53935;
        }

        .btn-black {
            background: #111;
        }

        #balanceMessage {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            min-height: 24px;
        }

        /* ЗАГРУЗКА */
        .loader {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: #888;
        }

        .loader-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #111;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ОШИБКА */
        .error {
            text-align: center;
            padding: 60px;
        }

        .error-icon {
            font-size: 60px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 700;
            margin-top: 16px;
        }

        .error-text {
            color: #888;
            margin-top: 8px;
        }

        /* АДАПТИВ */
        @media(max-width:700px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width:600px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .logo-text h1 {
                font-size: 22px;
            }
            .logo-text p {
                font-size: 12px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
            }
            .header-right {
                width: 100%;
                display: flex;
                justify-content: space-between;
            }
            .back-home {
                width: 100%;
            }
            .profile-card {
                padding: 20px;
            }
            .balance-row {
                flex-direction: column;
            }
            #balanceInput {
                width: 100%;
                min-width: 100%;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ШАПКА -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">⭐</div>
            <div class="logo-text">
                <h1>White Stars</h1>
                <p>Профиль пользователя</p>
            </div>
        </div>
        <div class="header-right">
            <button class="back-home" onclick="window.location.href='admin.html'">← Назад в админку</button>
        </div>
    </div>

    <!-- КОНТЕНТ -->
    <div id="profileContent">
        <!-- Сюда загрузится профиль -->
    </div>

</div>

<script>
alert("PROFILE V2");
    // ============ ПОЛУЧАЕМ ID ИЗ URL ============
    function getUserId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }

    // ============ ЗАГРУЖАЕМ ПРОФИЛЬ ============
    async function loadProfile() {
        console.log("ID =", userId);
        const userId = getUserId();
        const container = document.getElementById('profileContent');

        if (!userId) {
            container.innerHTML = `
                <div class="profile-card error">
                    <div class="error-icon">❌</div>
                    <div class="error-title">ID не указан</div>
                    <div class="error-text">Передайте ID пользователя в параметре ?id=</div>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="profile-card loader">
                <div class="loader-spinner"></div>
                <div>Загрузка профиля...</div>
            </div>
        `;

        try {
            const res = await fetch('https://white-stars-api.onrender.com/api/users', {
                headers: {
                    'x-admin-key': 'white-stars-super-admin'
                }
            });
console.log("STATUS =", res.status);

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }

            const users = await res.json();
console.log(users);
            const user = users.find(u => String(u.telegram_id) === String(userId));

            if (!user) {
                container.innerHTML = `
                    <div class="profile-card error">
                        <div class="error-icon">👤</div>
                        <div class="error-title">Пользователь не найден</div>
                        <div class="error-text">Пользователь с ID ${userId} не существует</div>
                    </div>
                `;
                return;
            }

            renderProfile(user);

        } catch (err) {

    console.error(err);

    alert(err);

    container.innerHTML = `
        <div class="profile-card error">
            <div class="error-icon">⚠️</div>
            <div class="error-title">Ошибка загрузки</div>
            <div class="error-text">${err}</div>
        </div>
    `;

}

    // ============ ОТРИСОВКА ПРОФИЛЯ ============
    function renderProfile(user) {
        const container = document.getElementById('profileContent');

        const avatar = user.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23ddd%22/%3E%3Ctext x=%2240%22 y=%2252%22 text-anchor=%22middle%22 font-size=%2236%22 fill=%22%23999%22%3E👤%3C/text%3E%3C/svg%3E';
        const username = user.username || 'Без имени';
        const firstName = user.first_name || '';
        const lastName = user.last_name || '';
        const fullName = [firstName, lastName].filter(Boolean).join(' ') || 'Не указано';

        // Статус онлайн
        let statusHtml = '';
        if (user.online) {
            statusHtml = '<span class="online">🟢 В сети</span>';
        } else {
            let lastSeenText = 'неизвестно';
            if (user.last_seen) {
                const date = new Date(user.last_seen);
                if (!isNaN(date)) {
                    lastSeenText = date.toLocaleString('ru-RU', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            }
            statusHtml = `<span class="offline">Был в сети ${lastSeenText}</span>`;
        }

        const regDate = user.registered_at ? new Date(user.registered_at).toLocaleDateString('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        }) : 'неизвестно';

        container.innerHTML = `
            <div class="profile-card">
                <!-- Шапка профиля -->
                <div class="profile-header">
                    <img class="profile-avatar" src="${avatar}" alt="avatar" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23ddd%22/%3E%3Ctext x=%2240%22 y=%2252%22 text-anchor=%22middle%22 font-size=%2236%22 fill=%22%23999%22%3E👤%3C/text%3E%3C/svg%3E'">
                    <div>
                        <div class="profile-name">${username}</div>
                        <div class="profile-id">ID: ${user.telegram_id}</div>
                        <div class="profile-status">${statusHtml}</div>
                    </div>
                </div>

                <!-- Статистика -->
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="profileBalance">${user.balance || 0} ₽</div>
                        <div class="stat-label">💰 Баланс</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${user.total_spent || 0} ₽</div>
                        <div class="stat-label">💳 Потрачено</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${user.total_deposit || 0} ₽</div>
                        <div class="stat-label">📥 Пополнено</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${user.referral_count || 0}</div>
                        <div class="stat-label">👥 Рефералов</div>
                    </div>
                </div>

                <!-- ИЗМЕНЕНИЕ БАЛАНСА -->
                <div class="balance-edit">
                    <h4>✏️ Изменить баланс</h4>
                    <div class="balance-row">
                        <input type="number" id="balanceInput" step="0.01" placeholder="Введите сумму">
                        <button class="btn btn-green" onclick="changeBalance('add')">➕ Добавить</button>
                        <button class="btn btn-red" onclick="changeBalance('subtract')">➖ Списать</button>
                        <button class="btn btn-black" onclick="changeBalance('set')">📌 Установить</button>
                    </div>
                    <div id="balanceMessage"></div>
                </div>

                <!-- Детальная информация -->
                <div style="margin-top:24px;">
                    <div class="info-row">
                        <span class="info-label">📛 Полное имя</span>
                        <span class="info-value">${fullName}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">📅 Дата регистрации</span>
                        <span class="info-value">${regDate}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">📱 Telegram ID</span>
                        <span class="info-value">${user.telegram_id}</span>
                    </div>
                    ${user.referrer_id ? `
                    <div class="info-row">
                        <span class="info-label">🔗 Пригласил</span>
                        <span class="info-value">${user.referrer_id}</span>
                    </div>
                    ` : ''}
                </div>
            </div>
        `;
    }

    // ============ ИЗМЕНЕНИЕ БАЛАНСА ============
    async function changeBalance(action) {
        const input = document.getElementById('balanceInput');
        const message = document.getElementById('balanceMessage');
        const amount = parseFloat(input.value);

        if (isNaN(amount) || amount <= 0) {
            message.style.color = '#e53935';
            message.textContent = '❌ Введите корректную сумму (больше 0)';
            return;
        }

        const userId = getUserId();
        if (!userId) {
            message.style.color = '#e53935';
            message.textContent = '❌ ID пользователя не найден';
            return;
        }

        message.style.color = '#888';
        message.textContent = '⏳ Сохранение...';

        try {
            const res = await fetch('https://white-stars-api.onrender.com/admin/balance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-key': 'white-stars-super-admin'
                },
                body: JSON.stringify({
                    telegram_id: String(userId),
                    action: action,
                    amount: amount
                })
            });

            if (!res.ok) {
                const errorData = await res.json();
                throw new Error(errorData.message || `HTTP ${res.status}`);
            }

            const data = await res.json();

            const balanceElement = document.getElementById('profileBalance');
            if (balanceElement) {
                balanceElement.textContent = `${data.new_balance || data.balance || 0} ₽`;
            }

            message.style.color = '#22c55e';
            message.textContent = `✅ Баланс успешно обновлён! Новый баланс: ${data.new_balance || data.balance || 0} ₽`;
            input.value = '';

            setTimeout(() => {
                loadProfile();
            }, 2000);

        } catch (err) {
            console.error(err);
            message.style.color = '#e53935';
            message.textContent = `❌ Ошибка: ${err.message || 'Не удалось изменить баланс'}`;
        }
    }

    // ============ ЗАГРУЗКА ПРИ СТАРТЕ ============
    document.addEventListener('DOMContentLoaded', loadProfile);

    // ============ ГЛОБАЛЬНЫЙ ДОСТУП ============
    window.changeBalance = changeBalance;
    window.loadProfile = loadProfile;
</script>

</body>
</html>
