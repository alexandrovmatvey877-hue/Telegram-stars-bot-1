<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WHITE STARS ADMIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:#f5f5f7;
color:#111;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

h1{
font-size:32px;
font-weight:800;
}

.back{
border:none;
background:#111;
color:#fff;
padding:12px 20px;
border-radius:14px;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.back:active{
transform:scale(.97);
}

.table-box{
background:#fff;
border-radius:22px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#fafafa;
font-size:14px;
color:#666;
padding:18px;
text-align:left;
}

td{
padding:18px;
border-top:1px solid #ececec;
}

input{
width:90px;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:15px;
}

input:focus{
border-color:#111;
}

.save{
border:none;
background:#111;
color:white;
padding:10px 18px;
border-radius:10px;
font-weight:700;
cursor:pointer;
margin-left:8px;
transition:.2s;
}

.save:active{
transform:scale(.97);
}

@media(max-width:700px){

.header{
flex-direction:column;
align-items:flex-start;
gap:15px;
}

table{
font-size:14px;
}

th,td{
padding:12px;
}

input{
width:70px;
}

.save{
margin-top:8px;
margin-left:0;
display:block;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>⭐ WHITE STARS ADMIN</h1>

<button class="back" onclick="history.back()">
← Назад
</button>

</div>

<div class="table-box">

<table>

<thead>

<tr>

<th>ID</th>
<th>Username</th>
<th>Balance</th>
<th>Изменить</th>

</tr>

</thead>

<tbody id="users"></tbody>

</table>

</div>

</div>

<script>

loadUsers();

function loadUsers(){

fetch("https://white-stars-api.onrender.com/users",{
headers:{
"x-admin-key":"white-stars-super-admin"
}
})

.then(r=>r.json())

.then(users=>{

const tbody=document.getElementById("users");

tbody.innerHTML="";

users.forEach(user=>{

tbody.innerHTML+=`

<tr>

<td>${user.telegram_id}</td>

<td>${user.username}</td>

<td>${user.balance}</td>

<td>

<input
id="b${user.telegram_id}"
type="number"
value="${user.balance}">

<button
class="save"
onclick="save('${user.telegram_id}')">

Сохранить

</button>

</td>

</tr>

`;

});

})

.catch(err=>{

alert(err);

});

}

function save(id){

const balance=document.getElementById("b"+id).value;

fetch("https://white-stars-api.onrender.com/set-balance",{

method:"POST",

headers:{
"Content-Type":"application/json",
"x-admin-key":"white-stars-super-admin"
},

body:JSON.stringify({

telegram_id:id,
balance:Number(balance)

})

})

.then(r=>r.json())

.then(()=>{

alert("Баланс изменён");

loadUsers();

})

.catch(err=>{

alert(err);

});

}

</script>

</body>
</html>
