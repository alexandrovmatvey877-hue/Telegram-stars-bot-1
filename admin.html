<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>White Stars Admin</title>

<link rel="stylesheet" href="css/admin.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                ⭐
            </div>

            <div class="logo-text">
                <h1>White Stars</h1>
                <p>Админ-панель</p>
            </div>

        </div>

        <div class="header-buttons">

            <button id="homeBtn">
                ← Назад
            </button>

            <button id="reloadBtn">
                ⟳ Обновить
            </button>

        </div>

    </header>


    <nav class="tabs">

    <button class="tab active" data-page="users">
        👥 Пользователи
    </button>

    <button class="tab" data-page="operations">
        📄 Операции
    </button>

    <button class="tab" data-page="settings">
        ⚙️ Настройки
    </button>

</nav>


    <main>

        <section id="usersPage" class="page active">

            <div class="search-panel">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Поиск пользователя">

                <select id="sortSelect">

                    <option value="last_seen">
                        Последний вход
                    </option>

                    <option value="balance">
                        Баланс
                    </option>

                    <option value="registered">
                        Регистрация
                    </option>

                    <option value="deposit">
                        Пополнения
                    </option>

                    <option value="spent">
                        Покупки
                    </option>

                </select>

                <button id="refreshUsers">
                    Обновить
                </button>

            </div>

            <div id="usersList"></div>

        </section>



        <section id="operationsPage" class="page">

            <div id="operationsList"></div>

        </section>



        <section id="settingsPage" class="page">

            <div class="settings-tabs">

    <button class="settings-tab active" data-settings="prices">
        📊 Тарифы
    </button>

    <button class="settings-tab" data-settings="wallet">
        💎 TON Кошелек
    </button>

    <button class="settings-tab" data-settings="services">
        🛠 Услуги
    </button>

    <button class="settings-tab" data-settings="notifications">
        🔔 Уведомления
    </button>

    <button class="settings-tab" data-settings="system">
        ⚙️ Система
    </button>

</div>

            <div id="settingsContent"></div>

        </section>

    </main>

</div>

<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ton.js"></script>
<script src="js/users.js"></script>
<script src="js/settings.js"></script>
<script src="js/operations.js"></script>
<script src="js/adminPanel.js"></script>

</body>
</html>
