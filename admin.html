<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>White Stars Admin</title>

<link rel="stylesheet" href="css/admin.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

<div class="container">


<header class="header">


<div class="system-status" id="systemStatus">

    <div class="traffic-lights">

        <span id="statusGreen" class="light green active"></span>
        <span id="statusYellow" class="light yellow"></span>
        <span id="statusRed" class="light red"></span>

    </div>


    <div class="status-text">

        <span id="statusTitle">
            NORMAL
        </span>

        <small id="statusInfo">
            Все системы работают
        </small>

    </div>

</div>



<div class="stop-panel">

<h3>
🚨 Управление продажами
</h3>


<button id="stopSalesBtn">
🛑 Остановить продажи
</button>


<button id="startSalesBtn">
▶️ Запустить продажи
</button>


</div>



<div class="logo">

<div class="logo-icon">
⭐
</div>


<div class="logo-text">

<h1>
White Stars
</h1>

<p>
Админ-панель
</p>

</div>


</div>



<div class="header-buttons">


<button id="homeBtn">
← Назад
</button>


<button id="reloadBtn">
⟳ Обновить
</button>


</div>


</header>




<nav class="tabs">


<button class="tab active" data-page="users">
👥 Пользователи
</button>


<button class="tab" data-page="operations">
📄 Операции
</button>


<button class="tab" data-page="settings">
⚙️ Настройки
</button>


<button class="tab" data-page="wheel">
🎡 Рулетка
</button>

<button class="tab" data-page="promocodes">
🎁 Промокоды
</button>

</nav>





<main>



<section id="usersPage" class="page active">



<div class="search-panel">



<input

id="searchInput"

type="text"

placeholder="Поиск пользователя">


<select id="sortSelect">


<option value="last_seen">
Последний вход
</option>


<option value="balance">
Баланс
</option>


<option value="registered">
Регистрация
</option>


<option value="deposit">
Пополнения
</option>


<option value="spent">
Покупки
</option>


<option value="referrals">
Рефералы
</option>


</select>



<button id="refreshUsers">

Обновить

</button>



</div>





<div id="usersList">

</div>



</section>







<section id="operationsPage" class="page">

<div id="operationsList">

</div>

</section>







<section id="wheelPage" class="page">


<h2>
🎡 Управление рулеткой
</h2>



<div class="wheel-form">


<input
id="wheelName"
placeholder="Название приза">


<input
id="wheelType"
placeholder="Тип (stars/premium)">


<input
id="wheelValue"
placeholder="Количество">


<input
id="wheelChance"
placeholder="Шанс %">

<input
id="wheelColor"
type="color"
value="#ffffff">

<button id="addWheelPrizeBtn">

Добавить приз

</button>


</div>



<div id="wheelList">

Загрузка...

</div>



</section>

<section id="promocodesPage" class="page">

<h2>
🎁 Управление промокодами
</h2>


<div class="promo-form">

<input
id="promoCode"
placeholder="Код промокода">


<select id="promoType">

<option value="balance">
💰 Баланс
</option>

<option value="stars">
⭐ Stars
</option>

<option value="premium">
👑 Premium
</option>

<option value="gift">
🎁 Gift
</option>

<option value="nft">
🖼 NFT
</option>

</select>


<input
id="promoValue"
placeholder="Награда">


<input
id="promoMaxUses"
placeholder="Макс. активаций (0 = безлимит)">


<input
id="promoExpires"
type="datetime-local">


<button id="createPromoBtn">
Создать промокод
</button>


</div>


<h3>
📋 Список промокодов
</h3>


<div id="promoList">

Загрузка...

</div>


</section>

<section id="settingsPage" class="page">


<div class="settings-tabs">


<button class="settings-tab active" data-settings="prices">

📊 Тарифы

</button>



<button class="settings-tab" data-settings="wallet">

💎 TON Кошелек

</button>



<button class="settings-tab" data-settings="services">

🛠 Услуги

</button>



<button class="settings-tab" data-settings="notifications">

🔔 Уведомления

</button>



<button class="settings-tab" data-settings="system">

⚙️ Система

</button>



</div>



<div id="settingsContent">

</div>



</section>



</main>


</div>





<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>

<script src="js/api.js"></script>

<script src="js/ton.js"></script>

<script src="js/users.js"></script>

<script src="js/settings.js"></script>

<script src="js/operations.js"></script>

<script src="js/adminPanel.js"></script>

<script src="js/promos.js"></script>

<script src="js/wheelAdmin.js"></script>



</body>
</html>
