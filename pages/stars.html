<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telegram Stars — WHITE STARS</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="../css/stars.css">
</head>


<body>

<button onclick="goBack()">
    ← Назад в меню
</button>

<div class="container">


    <div class="header">

        <div class="logo">
            ⭐ WHITE STARS
        </div>

        <div class="subtitle">
            Покупка Telegram Stars
        </div>

    </div>




    <div class="card">


        <h2>
            Получатель
        </h2>


        <input 
            id="username"
            type="text"
            placeholder="@username"
        >



    </div>





    <div class="card">


        <h2>
            Выберите количество
        </h2>



        <div 
            class="packs"
            id="packs"
        >


            <!--
            Кнопки создаются JS
            из PACKS
            -->


        </div>


    </div>






    <div class="card calculator">


        <h2>
            Расчет
        </h2>


        <div class="row">

            <span>
                Stars
            </span>


            <span id="starsAmount">
                0 ⭐
            </span>

        </div>




        <div class="row">

            <span>
                Цена 1 ⭐
            </span>


            <span id="rate">
                0 ₽
            </span>

        </div>





        <div class="total">


            <span>
                К оплате
            </span>


            <strong id="price">
                0 ₽
            </strong>


        </div>



    </div>






    <button 
        class="buy-button"
        onclick="buyStars()"
    >

        Купить Stars

    </button>






    <div class="info">


        <p>
            ⭐ Stars поступают напрямую на указанный аккаунт Telegram.
        </p>


        <p>
            🔒 Безопасная покупка через WHITE STARS.
        </p>


    </div>




</div>





<script src="../js/stars.js"></script>


</body>

</html>
