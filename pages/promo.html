<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Промокод — WHITE STARS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../css/promo.css">

</head>


<body>


<div class="container">


    <div class="card">

        <div class="icon">
            🎁
        </div>


        <h1>
            Промокод

        <p>
            Введите ваш промокод WHITE STARS

        <input

            placeholder="Введите промокод"
            autocomplete="off"
        >


        <button onclick="activatePromo()">
            Активировать
        </button>


        <div id="result"></div>


    </div>


</div>



<script src="../js/promo.js"></script>

</body>
