<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Профиль — WHITE STARS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../css/profile.css">

</head>


<body>

<div class="container">


    <!-- ПРОФИЛЬ -->
    <div class="profile-card">

        <img id="avatar" class="avatar" src="" alt="">

        <h2 id="name">
            Загрузка...
        </h2>


        <p id="username">
        </p>

    </div>



    <!-- БАЛАНС -->
    <div class="card">

        <h3>
            💰 Баланс
        </h3>

        <div id="balance">
            0 ₽
        </div>

    </div>



    <!-- СТАТИСТИКА -->
    <div class="card">

        <h3>
            📊 Статистика
        </h3>


        <p>
            Потрачено:
            <span id="spent">
                0
            </span>
            ₽
        </p>


        <p>
            Пополнено:
            <span id="deposit">
                0
            </span>
            ₽
        </p>


        <p>
            👥 Рефералы:
            <span id="refs">
                0
            </span>
        </p>


    </div>



    <!-- РЕФЕРАЛЬНАЯ СИСТЕМА -->
    <div class="card">

        <h3>
            🔗 Реферальная система
        </h3>


        <p>
            Приглашайте друзей и получайте бонусы WHITE STARS ⭐
        </p>


        <div class="ref-box">

            <span id="refLink">
                Загрузка...
            </span>

        </div>


        <button onclick="copyRefLink()">
            📋 Скопировать ссылку
        </button>


    </div>



    <!-- НАЗАД -->
    <button onclick="goBack()">
        ← Назад
    </button>


</div>



<script src="../js/profile.js"></script>
<script src="../js/menu.js"></script>


</body>

</html>
