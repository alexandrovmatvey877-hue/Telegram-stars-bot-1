<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Premium — WHITE STARS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../css/premium.css">

</head>


<body>


<div class="container">


    <div class="header">

        <div class="logo">
            👑 WHITE STARS
        </div>

        <div class="subtitle">
            Telegram Premium
        </div>

    </div>




    <div class="card">


        <h2>
            Выберите срок подписки
        </h2>


        <div id="premiumPlans">


            <!-- создается JS -->


        </div>


    </div>






    <div class="card calculator">


        <h2>
            Расчет
        </h2>


        <div class="row">

            <span>
                Срок
            </span>


            <span id="months">
                Не выбран
            </span>

        </div>




        <div class="row">

            <span>
                Цена
            </span>


            <span id="price">
                0 ₽
            </span>


        </div>


    </div>





    <button 
        class="buy-button"
        onclick="buyPremium()"
    >

        Купить Premium

    </button>





    <div class="info">

        <p>
            👑 Telegram Premium через WHITE STARS
        </p>

        <p>
            🔒 Безопасная покупка
        </p>

    </div>


</div>





<script src="../js/premium.js"></script>


</body>

</html>
