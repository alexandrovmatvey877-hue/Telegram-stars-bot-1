<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Пополнение баланса | WHITE STARS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:#fff;
color:#111;
}

.container{
max-width:460px;
margin:auto;
padding:20px;
}

h1{
font-size:30px;
margin-top:20px;
}

.subtitle{
margin-top:8px;
color:#666;
}

.card{
margin-top:30px;
background:#f5f5f7;
padding:20px;
border-radius:18px;
}

label{
display:block;
margin-bottom:10px;
font-weight:600;
}

input{
width:100%;
height:55px;
border:1px solid #ddd;
border-radius:14px;
padding:0 16px;
font-size:18px;
outline:none;
}

button{
width:100%;
height:55px;
margin-top:20px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:17px;
font-weight:700;
cursor:pointer;
}

.back{
width:100%;
margin-top:15px;
background:#ececec;
color:#111;
}

.info{
margin-top:20px;
font-size:14px;
color:#666;
line-height:22px;
}

</style>

</head>

<body>

<div class="container">

<h1>💳 Пополнение баланса</h1>

<div class="subtitle">
Введите сумму пополнения
</div>

<div class="card">

<label>Сумма (₽)</label>

<input
id="amount"
type="number"
placeholder="Например: 500"
min="1"
>

<button onclick="createPayment()">
Оплатить
</button>

<button class="back" onclick="history.back()">
Назад
</button>

<div class="info">
Минимальная сумма пополнения: 1 ₽
</div>

</div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

function createPayment(){

const amount=document.getElementById("amount").value;

if(!amount || amount<=0){
tg.showAlert("Введите корректную сумму.");
return;
}

tg.showAlert("Подключаем платежную систему...");

}

</script>

</body>
</html>
