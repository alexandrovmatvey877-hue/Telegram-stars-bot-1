<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Пополнение баланса | WHITE STARS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ============================================
           БАЗА — ТЁМНЫЙ ПРЕМИУМ
        ============================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080c1a;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f2f6;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.3);
            --gold: #f8d86a;
            --gold-dim: rgba(248, 216, 106, 0.08);
            --radius: 40px;
            --radius-sm: 28px;
            --radius-pill: 60px;
            --purple-glow: rgba(120, 80, 255, 0.15);
            --blue-glow: rgba(60, 120, 255, 0.08);
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            padding: 16px 12px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================
           ФОНОВЫЕ ORB — ТОЛЬКО 2
        ============================================ */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }
        body::before {
            width: 500px;
            height: 500px;
            top: -200px;
            right: -150px;
            background: radial-gradient(circle, rgba(120, 80, 255, 0.2), transparent 70%);
        }
        body::after {
            width: 400px;
            height: 400px;
            bottom: -150px;
            left: -100px;
            background: radial-gradient(circle, rgba(60, 120, 255, 0.12), transparent 70%);
        }

        /* ============================================
           ОСНОВНОЙ КОНТЕЙНЕР
        ============================================ */
        .container {
            position: relative;
            max-width: 460px;
            width: 100%;
            margin: 0 auto;
            padding: 28px 24px 32px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            z-index: 1;
        }

        /* ============================================
           ЛОГОТИП WHITE STARS
        ============================================ */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            user-select: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--gold), #d4a83a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #080c1a;
            box-shadow: 0 4px 12px rgba(248, 216, 106, 0.2);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 620;
            letter-spacing: -0.3px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }

        .logo-text span {
            color: var(--gold);
        }

        /* ============================================
           КАРТОЧКА БАЛАНСА
        ============================================ */
        .balance-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 18px 22px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 450;
            letter-spacing: 0.3px;
        }

        .balance-value {
            font-size: 26px;
            font-weight: 620;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .balance-value .currency {
            font-size: 16px;
            font-weight: 450;
            color: var(--text-secondary);
            margin-left: 2px;
        }

        /* ============================================
           ЗАГОЛОВОК СТРАНИЦЫ
        ============================================ */
        .page-title {
            font-size: 24px;
            font-weight: 620;
            letter-spacing: -0.4px;
            margin-bottom: 4px;
            color: #fff;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 22px;
        }

        /* ============================================
           ПОЛЕ ВВОДА СУММЫ
        ============================================ */
        .amount-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        .amount-input-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .amount-input-wrap .rub-symbol {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 18px;
            font-weight: 500;
            pointer-events: none;
        }

        #amount {
            width: 100%;
            height: 56px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 0 18px 0 40px;
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        #amount:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(248, 216, 106, 0.06);
        }

        #amount::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 16px;
        }

        /* Убираем стрелки у input number */
        #amount::-webkit-outer-spin-button,
        #amount::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        #amount {
            -moz-appearance: textfield;
        }

        /* ============================================
           КНОПКИ БЫСТРЫХ СУММ
        ============================================ */
        .quick-amounts {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .quick-btn {
            flex: 1;
            height: 42px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-pill);
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 470;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .quick-btn:hover {
            background: rgba(248, 216, 106, 0.06);
            border-color: rgba(248, 216, 106, 0.12);
            color: #fff;
        }

        .quick-btn:active {
            transform: scale(0.96);
        }

        .quick-btn.active {
            background: rgba(248, 216, 106, 0.08);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ============================================
           КНОПКА ОПЛАТЫ
        ============================================ */
        .pay-btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: var(--radius-pill);
            background: linear-gradient(135deg, var(--gold), #d4a83a);
            color: #080c1a;
            font-size: 17px;
            font-weight: 620;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(248, 216, 106, 0.15);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .pay-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 50%);
            pointer-events: none;
            border-radius: var(--radius-pill);
        }

        .pay-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(248, 216, 106, 0.2);
        }

        .pay-btn:active {
            transform: scale(0.98);
        }

        /* ============================================
           КНОПКА НАЗАД
        ============================================ */
        .back-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 450;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .back-btn:active {
            transform: scale(0.97);
        }

        /* ============================================
           ИНФО БЛОК
        ============================================ */
        .info-block {
            margin-top: 20px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.015);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .info-block p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            letter-spacing: 0.1px;
        }

        .info-block .highlight {
            color: var(--gold);
            font-weight: 450;
        }

        /* ============================================
           АДАПТИВНОСТЬ
        ============================================ */
        @media (max-width: 480px) {
            body {
                padding: 10px 6px;
                align-items: stretch;
            }
            .container {
                padding: 20px 16px 24px;
                border-radius: 28px;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
            }
            .logo-text {
                font-size: 18px;
            }
            .logo-icon {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            .page-title {
                font-size: 20px;
            }
            .balance-value {
                font-size: 22px;
            }
            .quick-btn {
                font-size: 13px;
                height: 38px;
            }
            #amount {
                font-size: 18px;
                height: 50px;
                padding-left: 36px;
            }
            .pay-btn {
                height: 50px;
                font-size: 16px;
            }
            .back-btn {
                height: 44px;
                font-size: 14px;
            }
            body::before {
                width: 300px;
                height: 300px;
                top: -100px;
                right: -80px;
                filter: blur(80px);
            }
            body::after {
                width: 250px;
                height: 250px;
                bottom: -80px;
                left: -60px;
                filter: blur(80px);
            }
        }

        @media (max-width: 380px) {
            .quick-amounts {
                gap: 6px;
            }
            .quick-btn {
                font-size: 12px;
                height: 34px;
            }
            .balance-card {
                padding: 14px 16px;
            }
            .balance-value {
                font-size: 20px;
            }
        }

        /* ============================================
           PREFERS-REDUCED-MOTION
        ============================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        /* ============================================
           HIGH CONTRAST
        ============================================ */
        @media (prefers-contrast: high) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.08);
                --glass-border: rgba(255, 255, 255, 0.15);
                --text-secondary: rgba(255, 255, 255, 0.85);
            }
            body::before,
            body::after {
                opacity: 0 !important;
            }
            .pay-btn {
                background: var(--gold);
                color: #000;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ЛОГОТИП ===== -->
        <div class="logo">
            <div class="logo-icon">★</div>
            <div class="logo-text">WHITE <span>STARS</span></div>
        </div>

        <!-- ===== КАРТОЧКА БАЛАНСА ===== -->
        <div class="balance-card">
            <span class="balance-label">Текущий баланс</span>
            <span class="balance-value" id="balanceDisplay">0 <span class="currency">₽</span></span>
        </div>

        <!-- ===== ЗАГОЛОВОК ===== -->
        <h1 class="page-title">Пополнение баланса</h1>
        <p class="page-subtitle">Введите сумму для пополнения</p>

        <!-- ===== ПОЛЕ СУММЫ ===== -->
        <label class="amount-label" for="amount">Сумма</label>
        <div class="amount-input-wrap">
            <span class="rub-symbol">₽</span>
            <input
            id="amount"
            type="number"
            placeholder="Введите сумму"
            min="1"
            step="1"
            />
        </div>

        <!-- ===== БЫСТРЫЕ СУММЫ ===== -->
        <div class="quick-amounts">
            <button class="quick-btn" data-amount="100">100 ₽</button>
            <button class="quick-btn" data-amount="500">500 ₽</button>
            <button class="quick-btn" data-amount="1000">1 000 ₽</button>
        </div>

        <!-- ===== КНОПКА ОПЛАТЫ ===== -->
        <button class="pay-btn" onclick="createPayment()">
            Оплатить
        </button>

        <!-- ===== КНОПКА НАЗАД ===== -->
        <button class="back-btn" onclick="history.back()">
            ← Назад
        </button>

        <!-- ===== ИНФО БЛОК ===== -->
        <div class="info-block">
            <p>
                Минимальная сумма пополнения: <span class="highlight">1 ₽</span><br />
                Средство зачисляется на баланс в течение <span class="highlight">1–2 минут</span>
            </p>
        </div>

    </div>

    <script>
        // ============================================
        // TELEGRAM WEBAPP
        // ============================================
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ============================================
        // createPayment — ОРИГИНАЛЬНАЯ ФУНКЦИЯ
        // ============================================
        function createPayment() {
            const amount = document.getElementById("amount").value;

            if (!amount || amount <= 0) {
                tg.showAlert("Введите корректную сумму.");
                return;
            }

            tg.showAlert("Подключаем платежную систему...");
        }

        // ============================================
        // БЫСТРЫЕ СУММЫ — ТОЛЬКО МЕНЯЮТ INPUT
        // ============================================
        document.querySelectorAll('.quick-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const amount = this.getAttribute('data-amount');
                const input = document.getElementById('amount');
                input.value = amount;
                input.focus();

                // Активный класс
                document.querySelectorAll('.quick-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
            });
        });

        // ============================================
        // СБРОС АКТИВНОГО КЛАССА ПРИ РУЧНОМ ВВОДЕ
        // ============================================
        document.getElementById('amount').addEventListener('input', function() {
            document.querySelectorAll('.quick-btn').forEach(function(b) {
                b.classList.remove('active');
            });
        });

        // ============================================
        // ТЕСТОВЫЙ БАЛАНС (можно заменить на реальный)
        // ============================================
        document.getElementById('balanceDisplay').innerHTML = '0 <span class="currency">₽</span>';
    </script>

</body>
</html>
